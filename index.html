<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intronomic</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background: #0f172a; color: #f8fafc; }
    h1 { color: #38bdf8; }
    .rule-box { background: #1e293b; padding: 1.5rem; border-radius: 8px; border-left: 4px solid #38bdf8; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Intronomic</h1>
  <p>Welcome to <strong>Intronomic</strong>, a game of Nomic where the primary activity is changing the rules of the game.</p>
  <div class="rule-box">
    <h3>Rule 101</h3>
    <p>All players must always abide by all the rules currently in effect, in the form in which they are currently enacted.</p>
  </div>
</body>
</html>
