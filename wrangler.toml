"$schema" = "node_modules/wrangler/config-schema.json"
name = "www"
main = "src/worker.ts"
compatibility_date = "2026-11-04"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = [
  "/api/*"
]

[observability.logs]
enabled = true
invocation_logs = false

[triggers]
crons = ["0 */5 * * *"]

[[kv_namespaces]]
binding = "KV"
id = "c0e4c264a77b494cae6a3eb2260eb2c0"